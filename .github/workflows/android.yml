name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: sed -i '/bridge.playgama.com/d' www/index.html
      - run: npx cap add android
      - name: Set app icon
        run: |
          if [ -f icon.png ]; then
            sudo apt-get install -y imagemagick
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
              set -- $d
              mkdir -p android/app/src/main/res/mipmap-$1
              convert icon.png -resize ${2}x${2} android/app/src/main/res/mipmap-$1/ic_launcher.png
              convert icon.png -resize ${2}x${2} android/app/src/main/res/mipmap-$1/ic_launcher_round.png
            done
          fi
      - run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: street-delivery-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
